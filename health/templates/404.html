{% extends "base.html" %}

{% block title %}Page not found{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="content-card text-center animate-fade-up">
                <div class="display-4 fw-bold text-primary mb-2">404</div>
                <h1 class="h3 fw-bold mb-2">Page not found</h1>
                <p class="text-muted">The page you were looking for does not exist or has moved.</p>
                <a href="{% url 'dashboard' %}" class="btn btn-primary">Return home</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
